apiVersion: v1
kind: ConfigMap
metadata:
  name: zercle-bun-template-config
data:
  APP_NAME: "zercle-bun-template"
  APP_ENVIRONMENT: "production"
  HTTP_HOST: "0.0.0.0"
  HTTP_PORT: "8080"
  DB_SSL_MODE: "prefer"
  DB_MAX_CONNS: "10"
  VALKEY_PORT: "6379"
  VALKEY_TTL: "30s"
  LOG_LEVEL: "info"
  OTEL_EXPORTER: "none"
  OTEL_SERVICE_NAME: "zercle-bun-template"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  CATALOG_ENABLED: "true"
  MACHINES_ENABLED: "true"
  SALES_ENABLED: "true"
