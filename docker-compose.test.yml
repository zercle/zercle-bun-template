services:
  test-db:
    image: mirror.gcr.io/postgres:18-alpine
    container_name: zercle-bun-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zercle-bun-test-network

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: zercle-bun-template-test
    environment:
      NODE_ENV: test
      DB_HOST: test-db
      DB_PORT: 5432
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test_db
      DB_SSLMODE: disable
      AUTH_ACCESS_TOKEN_SECRET: test-access-secret-key-minimum-32-chars
      AUTH_REFRESH_TOKEN_SECRET: test-refresh-secret-key-minimum-32-chars
    command: bun run test:coverage
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      - zercle-bun-test-network

networks:
  zercle-bun-test-network:
    driver: bridge
