# =============================================================================
# GitHub Actions Security Workflow
# =============================================================================
# This workflow runs weekly security scans to detect vulnerabilities.
#
# Triggers:
#   - Weekly schedule (Monday 06:00 UTC)
#   - Manual dispatch
#
# Jobs:
#   - trivy-scan: Full filesystem scan with Trivy
#   - dependency-audit: bun audit against the committed lockfile
# =============================================================================

name: Weekly Security Scan

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

jobs:
  # ==========================================================================
  # Job: Trivy Scan
  # ==========================================================================
  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "LOW,MEDIUM,HIGH,CRITICAL"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  # ==========================================================================
  # Job: Dependency Audit
  # ==========================================================================
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Audit lockfile dependencies
        run: |
          bun audit --audit-level=low
