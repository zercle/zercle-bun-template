name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify lockfile
        run: |
          bun install --frozen-lockfile
          git diff --exit-code bun.lock
      - run: bun run lint
      - run: bun run typecheck

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: oven/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run unit tests with coverage
        run: bun run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    services:
      postgres:
        image: docker.io/library/postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zercle_template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zercle_template_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
      valkey:
        image: docker.io/valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: zercle_template_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SSL_MODE: disable
        run: bun run migrate:up
      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: zercle_template_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SSL_MODE: disable
          VALKEY_HOST: localhost
          VALKEY_PORT: 6379
          VALKEY_DB: 0
          APP_ENVIRONMENT: test
        run: bun run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v7
      - uses: oven/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: docker build -f Containerfile -t zercle-bun-template:ci .
      - run: docker build -f Containerfile.migrate -t zercle-bun-template-migrate:ci .
